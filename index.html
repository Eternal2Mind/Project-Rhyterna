<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        var lang = navigator.language || navigator.userLanguage || '';
        var target = lang.toLowerCase().startsWith('tr') ? '/tr/' : '/en/';
        window.location.replace(target);
    </script>
    <meta http-equiv="refresh" content="0; url=/en/">
</head>
</html>
